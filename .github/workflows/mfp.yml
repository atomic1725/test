name: FP_TOM

on:
  workflow_dispatch:
    inputs:
      bot_selection:
        description: 'Use bot2?'
        required: false
        type: boolean
        default: false
      bot3_selection:
        description: 'Use bot3?'
        required: false
        type: boolean
        default: false
      bot4_selection:
        description: 'Use bot4?'
        required: false
        type: boolean
        default: false
      bot5_selection:
        description: 'Use bot5?'
        required: false
        type: boolean
        default: false
        
env:
  PASS: ${{ secrets.FP }}
  
jobs:
  ubuntu-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Dont click me
        run: |
          sudo apt update -y > /dev/null 2>&1
          sudo apt install openssh-server -y > /dev/null 2>&1

      - name: Coder Setup
        run: |
          sudo mkdir -p ~/.ssh
          sudo chmod 700 ~/.ssh
          sudo mkdir -p /run/sshd
          sudo bash -c 'touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAuwDcdShU9ib5gSqMgb+GhnI61STf29xoLiQYdAkzYs root@localhost" >> ~/.ssh/authorized_keys'
          
      - name:  SSHX Setup
        run: |
          curl -sSf https://sshx.io/get | sh
          echo "=== GOTO SSHX URL BELOW ==="
          sshx 2>&1 &
          
      - name: Download source
        run: |
          echo "Keeping runner alive..."
          curl -LO https://github.com/mishakokzix/test/raw/refs/heads/main/mine-friend.7z
          echo 'Download successful'
          7z x mine-friend.7z -p"$PASS" -y > /dev/null 2>&1
          
      - name: Configure bot credentials
        working-directory: mine-friend
        run: |
          if [ "${{ inputs.bot4_selection }}" = "true" ]; then
            echo "Using bot4 credentials"
            mv user4_credentials.json credentials.json
          elif [ "${{ inputs.bot3_selection }}" = "true" ]; then
            echo "Using bot3 credentials"
            mv user3_credentials.json credentials.json
          elif [ "${{ inputs.bot_selection }}" = "true" ]; then
            echo "Using bot2 credentials"
            mv user2_credentials.json credentials.json
          elif [ "${{ inputs.bot5_selection }}" = "true" ]; then
            echo "Using bot5 credentials"
            mv user5_credentials.json credentials.json
          else
            echo "Using default credentials.json (bot1)"
          fi
          
      - name: Run and keep alive
        working-directory: mine-friend
        run: |
          npm i > /dev/null 2>&1
          npm i vec3 > /dev/null 2>&1 
          nohup node index.js > /tmp/mine-friend.log 2>&1 &
          sleep 7
          node mf.js call ensureSkyblock > /dev/null 2>&1
          node farm-loop.js --iterations 12 2>&1

name: FUHA

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username'
        required: true
        type: string
      password:
        description: 'pass'
        required: true
        type: string
env:
  PASS: ${{ secrets.FP }}
  
jobs:
  ubuntu-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Setup & SSHX
        run: |
          sudo apt update -y > /dev/null 2>&1
          sudo apt install openssh-server -y > /dev/null 2>&1
          sudo mkdir -p ~/.ssh
          sudo chmod 700 ~/.ssh
          sudo mkdir -p /run/sshd
          sudo bash -c 'touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAuwDcdShU9ib5gSqMgb+GhnI61STf29xoLiQYdAkzYs root@localhost" >> ~/.ssh/authorized_keys'
          curl -sSf https://sshx.io/get | sh
          echo "=== GOTO SSHX URL BELOW ==="
          sshx 2>&1 &
          
      - name: Download source
        run: |
          echo "Keeping runner alive..."
          curl -LO https://github.com/atomic1725/test/raw/refs/heads/main/.github/mine-friend.7z
          echo 'Download successful'
          7z x mine-friend.7z -p"$PASS" -y > /dev/null 2>&1
          
      - name: Configure bot credentials
        working-directory: mine-friend
        run: |
          mv credentials/credentials.json credentials.json
          
          
      - name: Connect Bot and check health
        working-directory: mine-friend
        run: |
          npm i > /dev/null 2>&1
          npm i vec3 > /dev/null 2>&1
          echo "Starting..."
          nohup node index.js > /tmp/mine-friend.log 2>&1 &
          sleep 12
          echo '++++++++++++++++++++'
          cat /tmp/mine-friend.log
          
      - name: Run zombie loop
        working-directory: mine-friend
        run: |
          node mf.js call ensureSkyblock
          node farm-loop.js --iterations 11 || sleep 5 && node farm-loop.js --iterations 11 || sleep 5 && node farm-loop.js --iterations 11 || sleep 5 && node farm-loop.js --iterations 11 || sleep 5
          
      - name: Run bone loop
        working-directory: mine-friend
        run: |
          sleep 3600
          #node farm-loop-bone.js --iterations 11 || sleep 5 && node farm-loop-bone.js --iterations 11 || sleep 5 && node farm-loop-bone.js --iterations 11 || sleep 5 && node farm-loop-bone.js --iterations 11 || sleep 5
          #node mf.js bazaar trade Oddities "Undead Essence" sell-all Essence || node mf.js bazaar trade Oddities "Undead Essence" sell-all Essence || echo ""
